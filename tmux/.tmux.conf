# ~/.tmux.conf — sensible defaults for remote-dev work

# Truecolor + correct terminal type
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# Responsiveness
set -sg escape-time 10
set -g focus-events on

# Mouse + big scrollback
set -g mouse on
set -g history-limit 100000

# 1-based, gap-free window/pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Splits / new windows keep the current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Minimal status bar
set -g status-style "bg=default"
set -g status-left-length 30
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M"
