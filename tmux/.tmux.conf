# ~/.tmux.conf — sensible defaults for remote-dev work

# Truecolor + correct terminal type
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# Claude Code (and other CSI u-aware apps) multi-line input + notifications.
# - extended-keys lets tmux distinguish Shift+Enter from plain Enter so
#   Shift+Enter inserts a newline instead of submitting.
# - allow-passthrough lets desktop notifications and the progress bar reach
#   the outer terminal instead of being swallowed by tmux.
# See: https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Responsiveness
set -sg escape-time 10
set -g focus-events on

# Mouse + big scrollback
set -g mouse on
set -g history-limit 100000

# 1-based, gap-free window/pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Splits / new windows keep the current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Clipboard -> local Mac via OSC 52 (works through mosh+tmux).
# tmux emits OSC 52 without the "c;" selector that mosh requires, so force it.
# Caveat: mosh caps a copy at one UDP packet, so very large yanks truncate.
set -g set-clipboard on
set -ag terminal-overrides ",xterm*:Ms=\\E]52;c;%p2%s\\7"

# Minimal status bar
set -g status-style "bg=default"
set -g status-left-length 30
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M"

# Plugins (tpm): session persistence across server reboots.
# Install once: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then reload and press prefix + I (or run ~/.tmux/plugins/tpm/bin/install_plugins).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Keep this as the VERY LAST line of the file:
run '~/.tmux/plugins/tpm/tpm'
